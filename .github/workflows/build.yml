name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to publish releases on tag pushes

jobs:
  web:
    name: web (WebAssembly)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # LFS objects are cached by content so repeated runs don't spend the LFS download quota.
      - name: List LFS objects
        run: git lfs ls-files --long | cut -d ' ' -f1 | sort > .lfs-objects

      - uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-objects') }}

      - name: Fetch LFS objects
        run: git lfs pull

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.10

      - name: Install Ninja
        run: sudo apt-get install -y ninja-build

      # Both builds are deployed: Release at <pages>/release/, Debug (NV_ASSERT on) at <pages>/debug/.
      - name: Configure
        run: |
          emcmake cmake -S . -B build-release -G Ninja -DCMAKE_BUILD_TYPE=Release
          emcmake cmake -S . -B build-debug -G Ninja -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: |
          cmake --build build-release
          cmake --build build-debug

      # Tests that need no browser (tests/), run under Node; Debug has NV_ASSERT on.
      - name: Test
        run: |
          ctest --test-dir build-release --output-on-failure
          ctest --test-dir build-debug --output-on-failure

      - name: Package
        run: |
          cmake --install build-release --prefix dist/engine-web/release --component web
          cmake --install build-debug --prefix dist/engine-web/debug --component web

      - uses: actions/upload-artifact@v4
        with:
          name: engine-web
          path: dist/engine-web
          if-no-files-found: error

  # Pages serves the gh-pages branch (deployed by pages.yml): the default branch's builds at
  # <pages>/release/ and <pages>/debug/, and every other branch's Debug build at <pages>/<branch>/
  # ("/" in a branch name becomes "-"). Each push replaces only its own folders, in a one-commit
  # history, so the branch does not grow with every build.
  stage:
    if: github.event_name == 'push' && github.ref_type == 'branch'
    needs: web
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: engine-web
          path: build

      - name: Update the gh-pages branch
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          folder="${GITHUB_REF_NAME//\//-}"
          if [ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ] && { [ "$folder" = release ] || [ "$folder" = debug ]; }; then
            echo "::warning::A branch named $folder would replace the default branch's build; not published."
            exit 0
          fi
          url="https://x-access-token:${TOKEN}@github.com/${REPO}.git"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Other pushes may update the branch meanwhile: retry on a stale lease.
          for attempt in 1 2 3 4 5; do
            rm -rf site
            if git clone -q --depth 1 --branch gh-pages "$url" site; then
              lease="$(git -C site rev-parse HEAD)"
            else
              git init -q site
              git -C site remote add origin "$url"
              lease=""
            fi
            cd site
            if [ "$GITHUB_REF_NAME" = "$DEFAULT_BRANCH" ]; then
              rm -rf release debug
              cp -r ../build/release ../build/debug .
            else
              rm -rf "$folder"
              cp -r ../build/debug "$folder"
            fi
            touch .nojekyll
            git checkout -q --orphan next
            git add -A
            git commit -q -m "Pages: $GITHUB_REF_NAME at $GITHUB_SHA"
            if git push -q --force-with-lease="gh-pages:${lease}" origin next:gh-pages; then
              exit 0
            fi
            cd ..
            sleep $((attempt * 5))
          done
          echo "::error::Could not update gh-pages"
          exit 1

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: web
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Zip each platform
        run: |
          cd dist
          for d in */; do (cd "$d" && zip -qr "../${d%/}.zip" .); done

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
