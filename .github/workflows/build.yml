name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to publish releases on tag pushes

jobs:
  web:
    name: web (WebAssembly)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # LFS objects are cached by content so repeated runs don't spend the LFS download quota.
      - name: List LFS objects
        run: git lfs ls-files --long | cut -d ' ' -f1 | sort > .lfs-objects

      - uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-objects') }}

      - name: Fetch LFS objects
        run: git lfs pull

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.10

      - name: Install Ninja
        run: sudo apt-get install -y ninja-build

      - name: Configure
        run: emcmake cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Package
        run: |
          cmake --install build --prefix dist/engine-web --component web
          cp web/landing.html dist/engine-web/index.html

      - uses: actions/upload-artifact@v4
        with:
          name: engine-web
          path: dist/engine-web
          if-no-files-found: error

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          path: dist/engine-web

  # Publishes the web build to GitHub Pages on pushes to the default branch. Needs Pages enabled
  # (Settings > Pages > Source: GitHub Actions).
  pages:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: web
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: web
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Zip each platform
        run: |
          cd dist
          for d in */; do (cd "$d" && zip -qr "../${d%/}.zip" .); done

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
