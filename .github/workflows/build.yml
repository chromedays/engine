name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to publish releases on tag pushes

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64,   os: ubuntu-24.04 }
          - { name: linux-aarch64,  os: ubuntu-24.04-arm }
          - { name: windows-x86_64, os: windows-2022 }
          - { name: macos-aarch64,  os: macos-15 }

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libwayland-dev libxkbcommon-dev wayland-protocols

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Package
        shell: bash
        run: |
          cmake --install build --prefix "dist/engine-${{ matrix.name }}"
          cp README.md "dist/engine-${{ matrix.name }}/"

      - uses: actions/upload-artifact@v4
        with:
          name: engine-${{ matrix.name }}
          path: dist/engine-${{ matrix.name }}
          if-no-files-found: error

  web:
    name: web (WebAssembly)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.10

      - name: Install Ninja
        run: sudo apt-get install -y ninja-build

      - name: Configure
        run: emcmake cmake -S . -B build-web -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-web

      - name: Package
        run: |
          cmake --install build-web --prefix dist/engine-web
          cp web/landing.html dist/engine-web/index.html

      - uses: actions/upload-artifact@v4
        with:
          name: engine-web
          path: dist/engine-web
          if-no-files-found: error

      - uses: actions/upload-pages-artifact@v3
        if: vars.ENABLE_PAGES == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          path: dist/engine-web

  # Publishes the web build to GitHub Pages. Opt-in: enable Pages (Settings > Pages > Source:
  # GitHub Actions) and set the repository variable ENABLE_PAGES=true.
  pages:
    if: vars.ENABLE_PAGES == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: web
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, web]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Zip each platform
        run: |
          cd dist
          for d in */; do (cd "$d" && zip -qr "../${d%/}.zip" .); done

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
