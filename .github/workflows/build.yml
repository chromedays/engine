name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to publish releases on tag pushes

jobs:
  web:
    name: web (WebAssembly)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # LFS objects are cached by content so repeated runs don't spend the LFS download quota.
      - name: List LFS objects
        run: git lfs ls-files --long | cut -d ' ' -f1 | sort > .lfs-objects

      - uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-objects') }}

      - name: Fetch LFS objects
        run: git lfs pull

      # The shader tools (Slang's slangc and Dawn's tint, docs/specs/slang_shader_port.md) are downloaded once per version and
      # shared by both builds.
      - uses: actions/cache@v4
        with:
          path: .shader-tools
          key: shader-tools-${{ hashFiles('cmake/shaders.cmake') }}

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.10

      - name: Install Ninja
        run: sudo apt-get install -y ninja-build

      # Both builds are packaged in the engine-web artifact: Release, and Debug with NV_ASSERT on.
      - name: Configure
        run: |
          emcmake cmake -S . -B build-release -G Ninja -DCMAKE_BUILD_TYPE=Release -DNV_TOOLS_DIR=$PWD/.shader-tools
          emcmake cmake -S . -B build-debug -G Ninja -DCMAKE_BUILD_TYPE=Debug -DNV_TOOLS_DIR=$PWD/.shader-tools

      - name: Build
        run: |
          cmake --build build-release
          cmake --build build-debug

      # Tests that need no browser (tests/), run under Node; Debug has NV_ASSERT on.
      - name: Test
        run: |
          ctest --test-dir build-release --output-on-failure
          ctest --test-dir build-debug --output-on-failure

      - name: Package
        run: |
          cmake --install build-release --prefix dist/engine-web/release --component web
          cmake --install build-debug --prefix dist/engine-web/debug --component web

      - uses: actions/upload-artifact@v4
        with:
          name: engine-web
          path: dist/engine-web
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: web
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Zip each platform
        run: |
          cd dist
          for d in */; do (cd "$d" && zip -qr "../${d%/}.zip" .); done

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
