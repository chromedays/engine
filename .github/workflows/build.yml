name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to publish releases on tag pushes

jobs:
  web:
    name: web (WebAssembly)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # LFS objects are cached by content so repeated runs don't spend the LFS download quota.
      - name: List LFS objects
        run: git lfs ls-files --long | cut -d ' ' -f1 | sort > .lfs-objects

      - uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-objects') }}

      - name: Fetch LFS objects
        run: git lfs pull

      # The shader tools (Slang's slangc and Dawn's tint, docs/specs/slang_shader_port.md) are downloaded once per version and
      # shared by both builds.
      - uses: actions/cache@v4
        with:
          path: .shader-tools
          key: shader-tools-${{ hashFiles('cmake/shaders.cmake') }}

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.10

      - name: Install Ninja
        run: sudo apt-get install -y ninja-build

      # Both builds are deployed: Release at <pages>/release/, Debug (NV_ASSERT on) at <pages>/debug/. The auto-battler is
      # deployed apart from the sandbox (docs/specs/battle.md): <pages>/autobattler/release/ and .../debug/.
      - name: Configure
        run: |
          emcmake cmake -S . -B build-release -G Ninja -DCMAKE_BUILD_TYPE=Release -DNV_TOOLS_DIR=$PWD/.shader-tools
          emcmake cmake -S . -B build-debug -G Ninja -DCMAKE_BUILD_TYPE=Debug -DNV_TOOLS_DIR=$PWD/.shader-tools

      - name: Build
        run: |
          cmake --build build-release
          cmake --build build-debug

      # Tests that need no browser (tests/), run under Node; Debug has NV_ASSERT on.
      - name: Test
        run: |
          ctest --test-dir build-release --output-on-failure
          ctest --test-dir build-debug --output-on-failure

      - name: Package
        run: |
          cmake --install build-release --prefix dist/engine-web/release --component web
          cmake --install build-debug --prefix dist/engine-web/debug --component web
          cmake --install build-release --prefix dist/engine-web/autobattler/release --component autobattler
          cmake --install build-debug --prefix dist/engine-web/autobattler/debug --component autobattler

      - uses: actions/upload-artifact@v4
        with:
          name: engine-web
          path: dist/engine-web
          if-no-files-found: error

  # Pages serves the gh-pages branch (deployed by pages.yml): the default branch's builds at
  # <pages>/release/ and <pages>/debug/, and every other branch's Debug build at <pages>/<branch>/
  # ("/" in a branch name becomes "-"). The auto-battler follows the same pattern under <pages>/autobattler/:
  # release/, debug/ and <branch>/. Each push replaces only its own folders, in a one-commit
  # history, so the branch does not grow with every build.
  stage:
    if: github.event_name == 'push' && github.ref_type == 'branch'
    needs: web
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: engine-web
          path: build

      - name: Update the gh-pages branch
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          folder="${GITHUB_REF_NAME//\//-}"
          if [ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ] && { [ "$folder" = release ] || [ "$folder" = debug ] || [ "$folder" = autobattler ]; }; then
            echo "::warning::A branch named $folder would replace the default branch's build; not published."
            exit 0
          fi
          url="https://x-access-token:${TOKEN}@github.com/${REPO}.git"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Other pushes may update the branch meanwhile: retry on a stale lease.
          for attempt in 1 2 3 4 5; do
            rm -rf site
            if git clone -q --depth 1 --branch gh-pages "$url" site; then
              lease="$(git -C site rev-parse HEAD)"
            else
              git init -q site
              git -C site remote add origin "$url"
              lease=""
            fi
            cd site
            if [ "$GITHUB_REF_NAME" = "$DEFAULT_BRANCH" ]; then
              rm -rf release debug autobattler/release autobattler/debug
              mkdir -p autobattler
              cp -r ../build/release ../build/debug .
              cp -r ../build/autobattler/release ../build/autobattler/debug autobattler/
            else
              rm -rf "$folder" "autobattler/$folder"
              mkdir -p autobattler
              cp -r ../build/debug "$folder"
              cp -r ../build/autobattler/debug "autobattler/$folder"
            fi
            touch .nojekyll
            git checkout -q --orphan next
            git add -A
            git commit -q -m "Pages: $GITHUB_REF_NAME at $GITHUB_SHA"
            if git push -q --force-with-lease="gh-pages:${lease}" origin next:gh-pages; then
              exit 0
            fi
            cd ..
            sleep $((attempt * 5))
          done
          echo "::error::Could not update gh-pages"
          exit 1

  # The build dashboard (docs/specs/build_dashboard.md): the auto-battler's Release and Debug builds of the default branch and
  # of every branch with an open pull request go to Cloudflare R2, which the dashboard's Worker serves. It runs only for pushes
  # to this repository, so code from a fork never runs with the secrets; until they are set (tools/dashboard/README.md) it
  # publishes nothing.
  publish:
    if: github.event_name == 'push' && github.ref_type == 'branch'
    needs: web
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      BRANCH: ${{ github.ref_name }}
      SHA: ${{ github.sha }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
      DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
    steps:
      - name: Decide
        id: decide
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$DASHBOARD_TOKEN" ] || [ -z "$DASHBOARD_URL" ]; then
            echo "::notice::The dashboard's secrets are not set: nothing is published (tools/dashboard/README.md)."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif [ "$BRANCH" = "$DEFAULT_BRANCH" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            # A branch is published while it has an open pull request; opening one publishes its last build (publish-opened).
            open=$(gh api "repos/$REPO/pulls?head=${REPO%%/*}:$BRANCH&state=open" --jq length)
            echo "publish=$([ "$open" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.decide.outputs.publish == 'true'
        with:
          sparse-checkout: tools/dashboard

      - uses: actions/download-artifact@v4
        if: steps.decide.outputs.publish == 'true'
        with:
          name: engine-web
          path: build

      - name: Upload to R2
        if: steps.decide.outputs.publish == 'true'
        run: tools/dashboard/publish.sh build/autobattler

  # Opening (or reopening) a pull request publishes its branch's newest build without building again: the push's run made it.
  # A run still going is waited for; its own publish job may publish too, which does no harm. Only pull requests from this
  # repository's branches get here; a fork's never reach the secrets.
  publish-opened:
    if: >-
      github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'reopened')
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      BRANCH: ${{ github.event.pull_request.head.ref }}
      SHA: ${{ github.event.pull_request.head.sha }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
      DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
    steps:
      - name: Find the push's build
        id: find
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$DASHBOARD_TOKEN" ] || [ -z "$DASHBOARD_URL" ]; then
            echo "::notice::The dashboard's secrets are not set: nothing is published (tools/dashboard/README.md)."
            exit 0
          fi
          run=$(gh run list -R "$REPO" --workflow build.yml --event push --commit "$SHA" --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -z "$run" ]; then
            echo "::notice::No push build of $SHA; the branch's next push publishes it."
            exit 0
          fi
          gh run watch -R "$REPO" "$run" --exit-status > /dev/null
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.find.outputs.run
        with:
          sparse-checkout: tools/dashboard

      - name: Upload to R2
        if: steps.find.outputs.run
        run: |
          gh run download -R "$REPO" "${{ steps.find.outputs.run }}" -n engine-web -D build
          tools/dashboard/publish.sh build/autobattler

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: web
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Zip each platform
        run: |
          cd dist
          for d in */; do (cd "$d" && zip -qr "../${d%/}.zip" .); done

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
